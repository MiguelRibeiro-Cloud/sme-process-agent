[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sme-process-agent"
version = "0.1.0"
description = "Evidence-aware AI system for structured business-process discovery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<1",
    "mcp==2.2.0",
    "openai>=3.23,<4",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "uvicorn[standard]>=0.54,<1",
]

[tool.setuptools.packages.find]
include = ["backend*", "evals*"]

[tool.setuptools.package-data]
backend = [
    "synthetic_company/*.json",
    "synthetic_company/documents/*.md",
]
